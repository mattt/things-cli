# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: things

before:
  hooks:
    - go mod tidy
    - go run ./scripts --check

builds:
  - binary: things
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mattt/things-cli/internal/version.version={{.Version}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE.md
      - README.md
      - THIRD_PARTY_NOTICES.md
      - licenses/*.txt
      - licenses/manifest.json
      - licenses/dependencies/**/*
